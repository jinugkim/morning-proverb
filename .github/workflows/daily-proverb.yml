name: Daily Proverb

on:
  schedule:
    # 07:00 KST (22:00 UTC on the previous day)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-proverb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate and send proverb
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN_ME: ${{ secrets.KAKAO_REFRESH_TOKEN_ME }}
          KAKAO_REFRESH_TOKEN_WIFE: ${{ secrets.KAKAO_REFRESH_TOKEN_WIFE }}
          KAKAO_REFRESH_TOKEN_DAUGHTER: ${{ secrets.KAKAO_REFRESH_TOKEN_DAUGHTER }}
          KAKAO_REFRESH_TOKEN_FATHER_IN_LAW: ${{ secrets.KAKAO_REFRESH_TOKEN_FATHER_IN_LAW }}
          KAKAO_REFRESH_TOKEN_MOTHER_IN_LAW: ${{ secrets.KAKAO_REFRESH_TOKEN_MOTHER_IN_LAW }}
          KAKAO_REFRESH_TOKENS: ${{ secrets.KAKAO_REFRESH_TOKENS }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py
