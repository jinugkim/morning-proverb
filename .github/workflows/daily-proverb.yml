name: Daily Proverb

on:
  schedule:
    # 02:27 KST (17:27 UTC on the previous day)
    - cron: "27 17 * * *"
  workflow_dispatch:
    inputs:
      recipient:
        description: Message recipient (manual runs only)
        type: choice
        required: true
        default: all
        options:
          - all
          - me
          - wife
          - daughter
          - father_in_law
          - mother_in_law
      test_mode:
        description: Send a short receipt check without generating a proverb or updating history
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: daily-proverb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-proverb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate and send proverb
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN_ME: ${{ (github.event_name == 'schedule' || inputs.recipient == 'all' || inputs.recipient == 'me') && secrets.KAKAO_REFRESH_TOKEN_ME || '' }}
          KAKAO_REFRESH_TOKEN_WIFE: ${{ (github.event_name == 'schedule' || inputs.recipient == 'all' || inputs.recipient == 'wife') && secrets.KAKAO_REFRESH_TOKEN_WIFE || '' }}
          KAKAO_REFRESH_TOKEN_DAUGHTER: ${{ (github.event_name == 'schedule' || inputs.recipient == 'all' || inputs.recipient == 'daughter') && secrets.KAKAO_REFRESH_TOKEN_DAUGHTER || '' }}
          KAKAO_REFRESH_TOKEN_FATHER_IN_LAW: ${{ (github.event_name == 'schedule' || inputs.recipient == 'all' || inputs.recipient == 'father_in_law') && secrets.KAKAO_REFRESH_TOKEN_FATHER_IN_LAW || '' }}
          KAKAO_REFRESH_TOKEN_MOTHER_IN_LAW: ${{ (github.event_name == 'schedule' || inputs.recipient == 'all' || inputs.recipient == 'mother_in_law') && secrets.KAKAO_REFRESH_TOKEN_MOTHER_IN_LAW || '' }}
          KAKAO_TARGET_ACCOUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.recipient != 'all' && inputs.recipient || '' }}
          KAKAO_TEST_MODE: ${{ inputs.test_mode }}
          KAKAO_SKIP_FATHER_IN_LAW: "false"
          KAKAO_SKIP_MOTHER_IN_LAW: "false"
          KAKAO_REFRESH_TOKENS: ${{ (github.event_name == 'schedule' || inputs.recipient == 'all') && secrets.KAKAO_REFRESH_TOKENS || '' }}
          KAKAO_REFRESH_TOKEN: ${{ (github.event_name == 'schedule' || inputs.recipient == 'all') && secrets.KAKAO_REFRESH_TOKEN || '' }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py
      - name: Commit proverb history
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- docs/proverbs.json)" ]; then
            echo "No proverb history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/proverbs.json
          git commit -m "Update daily proverb history"
          git push origin "HEAD:${GITHUB_REF_NAME}"
